<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ICT Club</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #fff;
            overflow: hidden;
        }
        
        .bounce {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font: bold 2.5rem "Product Sans", sans-serif;
            white-space: nowrap;
        }
        
        .letter {
            animation: bounce 0.75s cubic-bezier(0.05, 0, 0.2, 1) infinite alternate;
            display: inline-block;
            margin-top: 0.5em;
            text-shadow: rgba(0, 0, 0, 0.3) 0 0 0.05em;
        }
        
        .letter:nth-child(1) {
            animation-delay: 0s;
            color: #8a2424;
        }
        
        .letter:nth-child(2) {
            animation-delay: 0.1s;
            color: #8a2424;
        }
        
        .letter:nth-child(3) {
            animation-delay: 0.2s;
            color: #8a2424;
        }
        
        .letter:nth-child(4) {
            animation-delay: 0.3s;
            color: transparent;
        }
        
        .letter:nth-child(5) {
            animation-delay: 0.4s;
            color: #252d92;
        }
        
        .letter:nth-child(6) {
            animation-delay: 0.5s;
            color: #252d92;
        }
        
        .letter:nth-child(7) {
            animation-delay: 0.6s;
            color: #252d92;
        }
        
        .letter:nth-child(8) {
            animation-delay: 0.7s;
            color: #252d92;
        }
        
        @keyframes bounce {
            0% {
                transform: translateY(0);
                text-shadow: rgba(0, 0, 0, 0.3) 0 0 0.05em;
            }
            100% {
                transform: translateY(-1em);
                text-shadow: rgba(0, 0, 0, 0.3) 0 1em 0.35em;
            }
        }
        
        @font-face {
            font-family: 'Product Sans';
            src: url('https://fonts.gstatic.com/s/productsans/v11/PwZc-YJydq14hP1dGs4eKg.woff2') format('woff2');
        }
    </style>
</head>

<body>
    <div class="bounce">
        <span class="letter">I</span>
        <span class="letter">C</span>
        <span class="letter">T</span>
        <span class="letter">&nbsp;</span>
        <span class="letter">C</span>
        <span class="letter">l</span>
        <span class="letter">u</span>
        <span class="letter">b</span>
    </div>

    <script>
        sessionStorage.setItem('visited', 'true');
        setTimeout(() => {
            window.location.href = "index.html";
        }, 3000);
    </script>
</body>

</html>
